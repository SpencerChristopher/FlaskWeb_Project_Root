name: Deploy to Production (Raspberry Pi)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hard_rebuild:
        description: "DANGER: Purge all volumes (database/logs) before deployment"
        type: boolean
        required: false
        default: false
      reseed_db:
        description: "Force full database reseed (Warning: May duplicate non-unique content)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    name: Native ARM64 Build, Test, and Deploy
    runs-on: [self-hosted, pi-prod]
    environment: production
    timeout-minutes: 60
    env:
      DEPLOY_ENV: production
      IMAGE_TAG: "local-prod:latest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          required_file: ci/required-prod.env
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
          PASSWORD_SERVICE_FROM_EMAIL: ${{ secrets.PASSWORD_SERVICE_FROM_EMAIL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_ENABLED: ${{ secrets.TURNSTILE_ENABLED || 'true' }}

      - name: Preflight Check (Pi Readiness)
        run: chmod +x scripts/preflight_pi.sh && ./scripts/preflight_pi.sh

      - name: "Debug: Pre-deployment Pi State"
        run: |
          {
            echo "### Pre-deployment State Snapshot"
            echo "#### Containers"
            echo '```'
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo '```'
            echo "#### Networks"
            echo '```'
            docker network ls
            echo '```'
            echo "#### Disk Usage"
            echo '```'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Native ARM64 Docker Build
        run: |
          docker build -t ${{ env.IMAGE_TAG }} .

      - name: "Fail-Fast: Verify Image Architecture"
        run: |
          # Confirms the built binary is actually ARM64 before proceeding
          docker run --rm ${{ env.IMAGE_TAG }} uname -m | grep -q "aarch64"

      - name: Deploy to Raspberry Pi (Production Swap)
        env:
          DEPLOY_CLEAN_START: "true"
          DEPLOY_RESET_VOLUMES: "${{ github.event.inputs.hard_rebuild == 'true' && 'true' || 'false' }}"
          FORCE_PRODUCTION_WIPE: "${{ github.event.inputs.hard_rebuild == 'true' && 'true' || 'false' }}"
          DEPLOY_REMOVE_ORPHANS: "true"
          DEPLOY_AUTO_RECOVER_MONGO_AUTH: "false"
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh

      - name: Verify service health (Fail-Fast)
        uses: ./.github/actions/health-check
        with:
          host_port: 80
          service_name: "flask_web_app"

      - name: "Fail-Fast: Verify Tunnel Connectivity"
        run: |
          echo "Waiting for cloudflared to connect..."
          for i in {1..15}; do
            echo "Attempt $i: Checking connectivity..."
            if docker logs cloudflared_tunnel 2>&1 | grep -E -q "Connected to|Registered tunnel connection"; then
              echo "Tunnel connected successfully."
              exit 0
            fi
            sleep 3
          done
          echo "Error: Tunnel failed to connect."
          exit 1

      - name: "Fail-Fast: Verify Database Connection"
        run: |
          docker exec flask_web_app /app/.venv/bin/python scripts/check_db_connection.py

      - name: Detect empty DB (Production)
        id: prod_db_empty
        run: |
          db_empty=$(docker exec flask_web_app /app/.venv/bin/python - <<'PY'
          import os
          from mongoengine import connect, disconnect
          from src.models.user import User
          from src.models.article import Article

          connect(host=os.environ.get("MONGO_URI"))
          user_count = User.objects.count()
          article_count = Article.objects.count()
          disconnect()

          print(f"users={user_count}")
          print(f"articles={article_count}")
          # DB is empty if no users OR if specifically articles are missing during a reseed
          print("true" if user_count == 0 else "false")
          PY
          )
          db_empty="$(echo "$db_empty" | tail -n 1)"
          echo "db_empty=${db_empty}" >> "$GITHUB_OUTPUT"

      - name: Create Admin User (Conditional)
        if: ${{ steps.prod_db_empty.outputs.db_empty == 'true' || github.event.inputs.hard_rebuild == 'true' }}
        run: |
          echo "Running one-time Admin creation..."
          docker exec \
            -e ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}" \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            flask_web_app /app/.venv/bin/python scripts/create_admin.py

      - name: Seed Database
        if: ${{ steps.prod_db_empty.outputs.db_empty == 'true' || github.event.inputs.reseed_db == 'true' || github.event.inputs.hard_rebuild == 'true' }}
        run: |
          seed_args="--admin-only"
          if [ "${{ github.event.inputs.reseed_db }}" = "true" ] || [ "${{ steps.prod_db_empty.outputs.db_empty }}" = "true" ]; then
            seed_args=""
            echo "Performing full database seed..."
          fi
          docker exec \
            -e ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}" \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            flask_web_app /app/.venv/bin/python scripts/seed_db.py $seed_args

      - name: Capture deploy logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > docker-compose-prod.log
